x-baseurl-note: >-
  Three API entries carry no baseURL on purpose. PX4 Autopilot and MAVLink are firmware and a wire
  protocol; neither terminates a network endpoint, so there is no host to name and none was guessed.
  MAVSDK has no baseURL for a different reason: its endpoint is grpc://{host}:50051 on a machine the
  consumer runs themselves, and apis.json requires an http/https base, so recording one would either
  fail the schema or misdescribe the transport. The real base is stated in grpc/_index.yml.
x-contract-note: >-
  Contract discovery 2026-09-06. No OpenAPI, Swagger, GraphQL, AsyncAPI or WSDL exists anywhere in
  this estate, and probing for one is the wrong search — Dronecode's contract is gRPC. 39 .proto files
  were fetched verbatim from github.com/mavlink/MAVSDK-Proto @ 4fbf5ce1 (38 services, 387 RPCs, 983
  messages, 63 of them server-streaming) plus 5 MAVLink component-metadata JSON Schemas whose $id
  resolves to mavlink.io. A prior round recorded this provider as publishing no contract at all.
apis:
  - aid: dronecode:dronecode-api
    name: PX4 Autopilot
    description: >-
      PX4 is the open source flight control firmware the Dronecode Foundation stewards — the software
      running on the vehicle that MAVLink and MAVSDK talk to. It exposes no network API of its own;
      its programmable surface is the MAVLink link, reached through MAVSDK or a ground station.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/dronecode.png
    humanURL: https://docs.px4.io/
    tags:
      - Drones
      - UAV
      - Autopilot
      - PX4
    properties:
      - type: Documentation
        url: https://docs.px4.io/
      - type: APIReference
        url: https://docs.px4.io/main/en/index.html
      - type: GitHubRepository
        url: https://github.com/PX4/PX4-Autopilot
      - type: ReleaseNotes
        url: https://docs.px4.io/main/en/releases/
      - type: Sandbox
        url: sandbox/dronecode-sandbox.yml
  - aid: dronecode:mavsdk
    name: MAVSDK gRPC API
    description: >-
      MAVSDK is the Dronecode Foundation's programmable interface to any MAVLink vehicle, and the only
      surface in the estate with a full machine-readable contract. 38 protobuf services and 387 RPCs
      cover arming and flight control, missions, geofencing, offboard setpoints, camera and gimbal,
      parameters, FTP, logs, failure injection and 59 telemetry subscriptions. It is delivered as
      mavsdk_server, a binary the consumer runs on their own machine or companion computer — there is
      no Dronecode-hosted endpoint, no authentication and no key.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/dronecode.png
    humanURL: https://mavsdk.mavlink.io/main/en/
    tags:
      - Drones
      - UAV
      - gRPC
      - Robotics
    properties:
      - type: Protobuf
        url: grpc/_index.yml
      - type: Protobuf
        url: grpc/dronecode-mavsdk-action.proto
      - type: Protobuf
        url: grpc/dronecode-mavsdk-mission.proto
      - type: Protobuf
        url: grpc/dronecode-mavsdk-telemetry.proto
      - type: ErrorCatalog
        url: errors/dronecode-problem-types.yml
      - type: APIReference
        url: https://mavsdk.mavlink.io/main/en/cpp/api_reference/index.html
      - type: Documentation
        url: https://mavsdk.mavlink.io/main/en/
      - type: Quickstart
        url: https://mavsdk.mavlink.io/main/en/python/quickstart.html
      - type: GitHubRepository
        url: https://github.com/mavlink/MAVSDK
      - type: SourceCode
        url: https://github.com/mavlink/MAVSDK-Proto
  - aid: dronecode:mavlink
    name: MAVLink Protocol
    description: >-
      MAVLink is the message-level interoperability standard for drones, and the Dronecode Foundation
      publishes it. The contract is the dialect XML — 19 files including common.xml, standard.xml,
      minimal.xml and development.xml — from which every language binding is generated, plus five
      JSON Schemas defining how a component describes its own parameters, actuators and peripherals.
      The dialect XML carries a machine-readable deprecation element with `since` and `replaced_by`.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/dronecode.png
    humanURL: https://mavlink.io/en/
    tags:
      - Drones
      - UAV
      - MAVLink
      - Standards
    properties:
      - type: APIReference
        url: https://mavlink.io/en/messages/common.html
      - type: Documentation
        url: https://mavlink.io/en/
      - type: JSONSchema
        url: json-schema/dronecode-mavlink-component-metadata-general.schema.json
      - type: JSONSchema
        url: json-schema/dronecode-mavlink-component-metadata-parameter.schema.json
      - type: JSONSchema
        url: json-schema/dronecode-mavlink-component-metadata-actuators.schema.json
      - type: JSONSchema
        url: json-schema/dronecode-mavlink-component-metadata-peripherals.schema.json
      - type: JSONSchema
        url: json-schema/dronecode-mavlink-component-metadata-translation.schema.json
      - type: GitHubRepository
        url: https://github.com/mavlink/mavlink
  - aid: dronecode:dronecode-org-rest
    name: dronecode.org WordPress REST API
    description: >-
      The only HTTP API the Foundation itself hosts, and the one its RFC 9727 /.well-known/api-catalog
      advertises. The discovery root is anonymous and lists 74 routes across 7 namespaces; the wp/v2
      content routes are switched off (rest_no_route) and the wp-abilities agent-tool routes require
      WordPress Application Password authentication (rest_forbidden). Recorded because the provider
      publishes it, not because it is an engineering surface.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/dronecode.png
    humanURL: https://dronecode.org/
    baseURL: https://dronecode.org/wp-json/
    tags:
      - CMS
      - WordPress
    properties:
      - type: APIReference
        url: https://developer.wordpress.org/rest-api/
      - type: Authentication
        url: authentication/dronecode-authentication.yml
      - type: APICatalog
        url: well-known/dronecode-api-catalog.json
