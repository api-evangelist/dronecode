aid: dronecode
name: Dronecode Foundation
description: >-
  The Dronecode Foundation is a vendor-neutral Linux Foundation collaborative project and the home of
  the open source flight stack the drone industry runs on: PX4 Autopilot, the MAVLink communication
  protocol, MAVSDK, QGroundControl and the Pixhawk hardware standards. Its machine-readable surface is
  a gRPC one — MAVSDK-Proto publishes 38 protobuf services and 387 RPCs covering arming, takeoff,
  missions, geofencing, telemetry, camera, gimbal and parameter control — alongside the MAVLink dialect
  XML and the component-metadata JSON Schemas that define how vehicles describe themselves. Nothing is
  hosted: the consumer runs mavsdk_server themselves, and every contract, SDK and firmware is free and
  open source.
