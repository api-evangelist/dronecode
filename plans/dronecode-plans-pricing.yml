specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Dronecode Foundation
providerId: dronecode
generated: '2026-09-06'
method: searched
source: https://dronecode.org/membership/ (HTTP 200, read 2026-09-06)
created: '2026-05-04'
modified: '2026-09-06'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file. That file invented a
  "dronecode-free" tier with a 1,000 requests/month quota and a 10 req/min rate limit. None of those
  numbers existed anywhere — Dronecode publishes no API quotas at all. Replaced with what the
  Foundation actually publishes.
tags:
  - Drones
  - Linux Foundation
  - Robotics
  - UAV
description: >-
  What the Dronecode Foundation actually charges for, and what it does not. There are NO API plans:
  every contract, SDK, specification and firmware the Foundation publishes is free, open source, and
  requires no account, key, quota or agreement. The published price list is FOUNDATION MEMBERSHIP —
  governance seats, flight-testing hours and consulting time — which buys influence and services, not
  API access.
api_access:
  priced: false
  plan_count: 0
  requires_account: false
  requires_key: false
  detail: >-
    No signup, no API key, no quota, no paid tier, no enterprise gate. The MAVSDK gRPC server is a
    binary the consumer runs on their own hardware, so there is nothing for the Foundation to meter.
  licences:
    - project: PX4 Autopilot
      spdx: BSD-3-Clause
      source: https://github.com/PX4/PX4-Autopilot
    - project: MAVSDK
      spdx: BSD-3-Clause
      source: https://github.com/mavlink/MAVSDK
    - project: QGroundControl
      spdx: Apache-2.0
      source: https://github.com/mavlink/qgroundcontrol
    - project: MAVLink
      spdx: NOASSERTION
      detail: >-
        github.com/mavlink/mavlink/COPYING (HTTP 200): the GENERATOR is (L)GPL v3, with an explicit
        exception releasing the GENERATED code — the message definitions a consumer actually ships —
        from those terms. Recorded as NOASSERTION because that is what the repository resolves to;
        the split is the fact that matters to an integrator.
membership:
  is_api_pricing: false
  note: >-
    Recorded because it is the only published price list the Foundation has, and because a reader
    comparing this provider to a commercial API will otherwise see "no pricing" and conclude wrongly.
    These dues buy governance and services. They do not gate, accelerate or expand API access, and a
    non-member has identical access to every contract in this repo.
  currency: USD
  period: annual
  classes: 4
  tiers:
    - name: Platinum
      price: '150000.00'
      currency: USD
      period: annual
      includes:
        - Technical Steering Committee seat
        - Dronecode Board of Directors seat
        - Join and create workgroups
        - Pull-request and pre-release flight testing with custom test cards
        - 15 consulting hours, priority requests, priority pull-request review
        - Logo placement, new-member announcement, product/service directory listing
        - Members-only Discord channel, mailing list, job board
    - name: Gold
      price: '50000.00'
      currency: USD
      period: annual
      includes:
        - Board representation — 1 representative for every 3 Gold members
        - Join and create workgroups
        - Pull-request and pre-release flight testing with custom test cards
        - 15 consulting hours, priority requests
        - Logo placement, new-member announcement, directory listing, Discord, mailing list, job board
    - name: Silver
      price_min: '5000.00'
      price_max: '20000.00'
      currency: USD
      period: annual
      metric: headcount
      scale:
        - band: '> 5000 employees'
          price: '20000.00'
        - band: 500-4999 employees
          price: '15000.00'
        - band: 100-499 employees
          price: '10000.00'
        - band: < 100 employees
          price: '5000.00'
      includes:
        - Board representation — 1 representative for every 10 Silver members
        - Workgroup participation
        - Pre-release flight testing (no custom test cards)
        - 15 consulting hours
        - Logo placement, new-member announcement, directory listing, Discord, mailing list, job board
    - name: Sponsored
      price: null
      note: >-
        Named as the fourth membership class on the membership page; no fee is published for it.
        Recorded as null rather than guessed.
plans: []
plans_note: >-
  Deliberately empty. plan_count is 0 because the provider publishes no API plans — an honest zero,
  not an unfilled field. The membership block above is not an API plan and must not be read as one.
