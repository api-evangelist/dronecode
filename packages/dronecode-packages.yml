gaps:
  - >-
    No first-party JavaScript/TypeScript client. MAVSDK-JavaScript (github.com/mavlink/MAVSDK-JavaScript,
    a grpc-web wrapper) was last pushed 2022-02-12 and was never published to npm; the `mavlink` npm
    name belongs to an unrelated 2013 package.
  - >-
    MAVSDK-CSharp and MAVSDK-Rust are both ARCHIVED in the github.com/mavlink organisation
    (last pushed 2022-02-11 and 2024-04-19). No .NET or Rust gRPC client is currently maintained.
