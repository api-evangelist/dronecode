method: derived
source: >-
  Derived from the verbatim contracts held in this repo — the 39 MAVSDK protobuf files under grpc/
  and the five MAVLink component-metadata JSON Schemas under json-schema/ — and from the published
  MAVLink specification at https://mavlink.io/en/ (HTTP 200, probed 2026-09-06). Each entry names the
  exact artifact or URL the claim reads from; nothing here is asserted from marketing prose.
provider: Dronecode Foundation
providerId: dronecode
note: >-
  Dronecode is unusual in this catalog: it is not a company conforming to somebody else's standard, it
  is the vendor-neutral body that PUBLISHES the standard its market runs on. MAVLink is the drone
  industry's message-level interoperability standard and Dronecode is its steward, so the
  domain-standard entry below is authorship, not adoption. There is no financial, health or telecom
  regime in play and none is claimed.
conformance:
  - id: mavlink
    name: MAVLink 2.0 micro air vehicle communication protocol
    category: domain-standard
    role: publisher
    conforms: true
    evidence: >-
      grpc/dronecode-mavsdk-mavlink-direct.proto — the MavlinkDirectService contract carries MavlinkMessage
      with `message_name` and a JSON `fields` payload, and states the message names are those of the
      MAVLink dialect XML. The dialect definitions themselves are published by this provider at
      https://github.com/mavlink/mavlink/tree/master/message_definitions/v1.0 (19 dialect XML files
      including common.xml, standard.xml, minimal.xml and development.xml) and rendered at
      https://mavlink.io/en/messages/common.html (HTTP 200, 2026-09-06).
    signature: >-
      The contract's own type system is MAVLink: mavlink_direct.proto passes MAVLink message names and
      fields through untranslated, and 36 of the 38 services are typed wrappers over MAVLink commands.
  - id: mavlink-component-information
    name: MAVLink COMPONENT_INFORMATION / component metadata
    category: domain-standard
    role: publisher
    conforms: true
    evidence: >-
      json-schema/dronecode-mavlink-component-metadata-{general,parameter,actuators,peripherals,translation}.schema.json
      — five JSON Schema draft-07 documents saved verbatim from
      https://raw.githubusercontent.com/mavlink/mavlink/master/component_metadata/ (all HTTP 200,
      2026-09-06). Their `description` fields name the MAVLink enum values directly:
      "Schema for COMP_METADATA_TYPE_GENERAL", "…_PARAMETER", "…_ACTUATORS", "…_PERIPHERALS", and the
      `$id` values resolve to https://mavlink.io/, this provider's own host.
    signature: '$id: https://mavlink.io/comp_version.schema.json + description "Schema for COMP_METADATA_TYPE_*"'
    consumed_by: grpc/dronecode-mavsdk-component-metadata.proto (ComponentMetadataService, 4 RPCs)
